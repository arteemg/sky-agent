[project]
name = "autoswarm"
version = "0.1.0"
description = "Autonomous multi-agent pipeline benchmark harness with a self-editing meta-agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "openai-agents",
    "openai",
    "harbor",
    "pandas",
    "openpyxl",
    "numpy",
    "requests>=2.31",
    "mcp>=2,<3",
    "httpx2>=2,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gepa>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.hatch.build.targets.sdist]
include = [
    "benchmark",
    "README.md",
    "pyproject.toml",
]
